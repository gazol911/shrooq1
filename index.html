<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فقاعات التنقل الذكية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#e3f2fd;--bg2:#bbdefb;--card:rgba(255,255,255,.82);--text:#0d2b4a;--muted:#587a9c;
  --line:#bcd6ee;--field:#f4f9ff;--g1:#00b4ff;--g2:#1565c0;--g3:#0a2f6b;--ok:#0b8f5a;--bad:#c62828;
  --shadow:0 12px 40px rgba(21,101,192,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#06142b;--bg2:#0b2a55;--card:rgba(14,35,70,.82);--text:#e6f2ff;--muted:#8fb2d6;
    --line:#244a7a;--field:#0c2145;--shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#06142b;--bg2:#0b2a55;--card:rgba(14,35,70,.82);--text:#e6f2ff;--muted:#8fb2d6;
  --line:#244a7a;--field:#0c2145;--shadow:0 12px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Tajawal",Tahoma,Arial,sans-serif;color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;padding:20px 14px 40px}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0}
.bubbles i{position:absolute;bottom:-120px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(0,180,255,.25) 60%,rgba(21,101,192,.15));
  animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px);opacity:0}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto}
.top{display:flex;justify-content:flex-end;margin-bottom:8px}
.icon-btn{width:auto;padding:8px 14px;font-size:14px;border-radius:20px;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.hero{text-align:center;color:#fff;border-radius:26px;padding:26px 18px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:var(--shadow)}
.logo{width:74px;height:74px;margin:0 auto 10px;border-radius:50%;
  background:radial-gradient(circle at 30% 28%,#fff,rgba(255,255,255,.25) 45%,rgba(255,255,255,.1));
  border:2px solid rgba(255,255,255,.7);animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero h1{margin:0;font-size:26px;font-weight:800}
.hero p{margin:4px 0 0;letter-spacing:2px;font-size:12px;opacity:.85}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h2{margin:0 0 14px;font-size:19px}
label{display:block;text-align:right;font-size:14px;font-weight:500;margin:12px 0 5px;color:var(--muted)}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);font:inherit;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 4px rgba(0,180,255,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:2px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--field);transition:.25s;user-select:none}
.type b{display:block;font-size:14px}
.type small{color:var(--muted);font-size:12px}
.type .dot{width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--g1) 55%,var(--g2))}
.type.on{border-color:var(--g1);background:linear-gradient(160deg,rgba(0,180,255,.2),rgba(21,101,192,.18));transform:translateY(-3px);box-shadow:0 8px 18px rgba(21,101,192,.3)}
.swap{display:flex;gap:8px;align-items:end}
.swap .grow{flex:1}
.swap button{width:46px;height:46px;padding:0;border-radius:50%;font-size:18px;flex:none;margin-bottom:0}
button{width:100%;border:0;color:#fff;font:inherit;font-weight:700;font-size:17px;padding:14px;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));box-shadow:0 8px 20px rgba(21,101,192,.4);transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:active{transform:translateY(0)}
.price{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;padding:14px;border-radius:14px;
  background:linear-gradient(135deg,rgba(0,180,255,.18),rgba(21,101,192,.18));font-weight:700}
.price span:last-child{font-size:22px;color:var(--g2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price span:last-child{color:var(--g1)}}
:root[data-theme="dark"] .price span:last-child{color:var(--g1)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px;text-align:right}
.ticket{display:none;border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);animation:pop .5s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.ticket .h{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:16px;text-align:center;font-weight:800;font-size:18px}
.ticket .b{background:var(--card);padding:16px;line-height:2}
.ticket .id{display:inline-block;background:var(--field);border:1px dashed var(--g1);border-radius:8px;padding:0 10px;direction:ltr;font-weight:700}
.list{display:grid;gap:10px}
.item{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.item small{color:var(--muted);display:block}
.item button{width:auto;padding:7px 12px;font-size:13px;background:linear-gradient(135deg,#5aa9e6,#1565c0);box-shadow:none}
.empty{color:var(--muted);text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <div class="top"><button type="button" class="icon-btn" id="theme">الوضع الداكن</button></div>

  <div class="hero">
    <div class="logo"></div>
    <h1>فقاعات التنقل الذكية</h1>
    <p>SMART MOBILITY BUBBLES</p>
  </div>

  <form class="card" id="booking" novalidate>
    <h2>احجز فقاعتك الآن</h2>

    <label for="name">اسم المستخدم</label>
    <input id="name" type="text" placeholder="اكتب اسمك" autocomplete="name">

    <label>نوع الفقاعة</label>
    <div class="types" id="types">
      <div class="type on" data-t="solo"><div class="dot"></div><b>فردية</b><small>٣٠ ر.س</small></div>
      <div class="type" data-t="family"><div class="dot"></div><b>عائلية</b><small>٥٠ ر.س</small></div>
      <div class="type" data-t="group"><div class="dot"></div><b>جماعية</b><small>٧٠ ر.س</small></div>
    </div>

    <div class="swap">
      <div class="grow">
        <label for="from">موقع الانطلاق</label>
        <input id="from" type="text" placeholder="من أين؟">
        <label for="to">الوجهة</label>
        <input id="to" type="text" placeholder="إلى أين؟">
      </div>
      <button type="button" id="swapBtn" title="تبديل">⇅</button>
    </div>

    <div class="row">
      <div><label for="date">تاريخ الرحلة</label><input id="date" type="date"></div>
      <div><label for="time">وقت الرحلة</label><input id="time" type="time"></div>
    </div>

    <label for="pax">عدد الركاب</label>
    <select id="pax"></select>

    <div class="price"><span>السعر التقديري</span><span id="price">٠ ر.س</span></div>
    <button type="submit">تأكيد الحجز</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div class="ticket" id="ticket">
    <div class="h">تم تأكيد حجز فقاعتك بنجاح</div>
    <div class="b" id="ticketBody"></div>
  </div>

  <div class="card">
    <h2>حجوزاتي</h2>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const TYPES={solo:{n:"فردية",base:30,max:1,per:0},family:{n:"عائلية",base:50,max:4,per:10},group:{n:"جماعية",base:70,max:8,per:12}};
const $=id=>document.getElementById(id);
const nf=n=>Number(n).toLocaleString("ar-EG");
let type="solo",bookings=[];

/* floating bubbles */
(function(){const w=$("bubbles");for(let i=0;i<14;i++){const e=document.createElement("i"),s=20+Math.random()*60;
e.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*15}s`;w.appendChild(e)}})();

/* storage helpers */
function load(){try{bookings=JSON.parse(localStorage.getItem("bubbles")||"[]")}catch(e){bookings=[]}}
function save(){try{localStorage.setItem("bubbles",JSON.stringify(bookings))}catch(e){}}

/* theme */
$("theme").onclick=()=>{
  const r=document.documentElement,dark=getComputedStyle(r).colorScheme.includes("dark");
  r.setAttribute("data-theme",dark?"light":"dark");
  $("theme").textContent=dark?"الوضع الداكن":"الوضع الفاتح";
};

/* date min = today */
(function(){const d=new Date(),p=n=>String(n).padStart(2,"0");$("date").min=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`})();

function fillPax(){
  const m=TYPES[type].max,s=$("pax"),old=+s.value||1;s.innerHTML="";
  for(let i=1;i<=m;i++){const o=document.createElement("option");o.value=i;o.textContent=nf(i);s.appendChild(o)}
  s.value=Math.min(old,m);s.disabled=m===1;calc();
}
function calc(){const t=TYPES[type],p=+$("pax").value||1;const v=t.base+t.per*(p-1);$("price").textContent=nf(v)+" ر.س";return v}

$("types").addEventListener("click",e=>{
  const c=e.target.closest(".type");if(!c)return;
  document.querySelectorAll(".type").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");type=c.dataset.t;fillPax();
});
$("pax").onchange=calc;
$("swapBtn").onclick=()=>{const a=$("from").value;$("from").value=$("to").value;$("to").value=a};

function render(){
  const l=$("list");l.innerHTML="";
  if(!bookings.length){l.innerHTML='<div class="empty">لا توجد حجوزات بعد</div>';return}
  bookings.forEach(b=>{
    const d=document.createElement("div");d.className="item";
    const i=document.createElement("div");
    i.innerHTML="<b></b><small></small>";
    i.firstChild.textContent=`${b.from} ← ${b.to}`;
    i.lastChild.textContent=`${TYPES[b.type].n} · ${b.date} · ${b.time} · ${nf(b.price)} ر.س`;
    const x=document.createElement("button");x.type="button";x.textContent="إلغاء";
    x.onclick=()=>{bookings=bookings.filter(k=>k.id!==b.id);save();render()};
    d.append(i,x);l.appendChild(d);
  });
}

$("booking").addEventListener("submit",e=>{
  e.preventDefault();
  const v={name:$("name").value.trim(),from:$("from").value.trim(),to:$("to").value.trim(),date:$("date").value,time:$("time").value,pax:+$("pax").value};
  let m="";
  if(!v.name)m="الرجاء إدخال اسمك.";
  else if(!v.from||!v.to)m="الرجاء إدخال موقع الانطلاق والوجهة.";
  else if(v.from===v.to)m="موقع الانطلاق والوجهة لا يمكن أن يكونا متطابقين.";
  else if(!v.date||!v.time)m="الرجاء اختيار التاريخ والوقت.";
  else if(new Date(v.date+"T"+v.time)<new Date())m="لا يمكن الحجز في وقت مضى.";
  $("err").textContent=m;if(m)return;

  const b={...v,type,price:calc(),id:"SB-"+Math.random().toString(36).slice(2,7).toUpperCase()};
  bookings.unshift(b);save();render();
  const t=$("ticketBody");t.innerHTML="";
  [["رقم الحجز",b.id],["الاسم",b.name],["نوع الفقاعة",TYPES[type].n],["المسار",`${b.from} ← ${b.to}`],["الموعد",`${b.date} · ${b.time}`],["الركاب",nf(b.pax)],["الإجمالي",nf(b.price)+" ر.س"]]
  .forEach(([k,val])=>{const r=document.createElement("div");r.textContent=k+": ";const s=document.createElement(k==="رقم الحجز"?"span":"b");if(k==="رقم الحجز")s.className="id";s.textContent=val;r.appendChild(s);t.appendChild(r)});
  $("ticket").style.display="block";$("ticket").scrollIntoView({behavior:"smooth",block:"center"});
  $("booking").reset();type="solo";
  document.querySelectorAll(".type").forEach((x,i)=>x.classList.toggle("on",i===0));fillPax();
});

load();fillPax();render();
</script>
</body>
</html>
